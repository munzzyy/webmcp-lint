<!doctype html>
<html>
<head><title>Order help</title></head>
<body>
<script>
  document.modelContext.registerTool({
    name: "getOrderStatus",
    description: "Returns the shipping status of an order.",
    inputSchema: {
      type: "object",
      properties: {orderId: {type: "string", maxLength: 32}},
    },
    annotations: {readOnlyHint: true},
    async execute({orderId}) {
      return fetch("/orders/" + orderId).then((r) => r.json());
    },
  });
</script>

</html>

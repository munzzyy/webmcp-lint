name: "webmcp-lint"
description: >-
  Lint a WebMCP tool manifest for prompt injection, missing safety hints, and
  unconstrained risky parameters, and upload the findings as SARIF so they
  land in the repo's Security tab.
author: "Cole Munz"

branding:
  icon: "shield"
  color: "blue"

inputs:
  python-version:
    description: "Python version used to install and run webmcp-lint."
    required: false
    default: "3.12"
  path:
    description: >-
      Manifest file, directory (checked for mcp.json / webmcp.json /
      .well-known/mcp.json inside it), or glob pattern to scan.
    required: false
    default: "."
  recursive:
    description: >-
      When "path" is a directory, also look inside its subdirectories
      ("true"/"false"). Useful for a monorepo with the manifest nested a
      few levels down.
    required: false
    default: "false"
  fail-on:
    description: "Minimum severity that fails the job (critical|high|medium|low|info|none)."
    required: false
    default: "high"
  ref:
    description: >-
      Git tag of munzzyy/webmcp-lint to install (it installs from source
      until it's on PyPI).
    required: false
    default: "v0.1.1"
  ignore:
    description: >-
      Rule ids to suppress everywhere, comma-separated (for example
      "WML-002,WML-004"). Empty means suppress nothing.
    required: false
    default: ""

outputs:
  result:
    description: "'pass' or 'fail', whether a finding at or above fail-on was found."
    value: ${{ steps.gate.outputs.result }}
  sarif-file:
    description: "Path to the generated SARIF file."
    value: ${{ steps.sarif.outputs.file }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install webmcp-lint
      shell: bash
      run: python3 -m pip install --quiet "git+https://github.com/munzzyy/webmcp-lint@${INPUTS_REF}"
      env:
        INPUTS_REF: ${{ inputs.ref }}

    # Generated separately from the fail-on gate below and with --fail-on
    # none, because render_sarif() always emits every finding regardless of
    # severity threshold -- the SARIF file shouldn't be missing results just
    # because they're below the job's own pass/fail bar.
    - name: Generate SARIF
      id: sarif
      shell: bash
      continue-on-error: true
      run: |
        set +e
        out="$RUNNER_TEMP/webmcp-lint.sarif"
        extra=()
        if [ -n "${INPUTS_IGNORE}" ]; then extra+=(--ignore "${INPUTS_IGNORE}"); fi
        if [ "${INPUTS_RECURSIVE}" = "true" ]; then extra+=(--recursive); fi
        webmcp-lint "${INPUTS_PATH}" "${extra[@]}" --sarif --fail-on none > "$out" 2>"$RUNNER_TEMP/webmcp-lint-sarif.err"
        code=$?
        set -e
        echo "file=$out" >> "$GITHUB_OUTPUT"
        if [ "$code" -ne 0 ]; then
          cat "$RUNNER_TEMP/webmcp-lint-sarif.err" >&2
        fi
        exit "$code"
      env:
        INPUTS_PATH: ${{ inputs.path }}
        INPUTS_IGNORE: ${{ inputs.ignore }}
        INPUTS_RECURSIVE: ${{ inputs.recursive }}

    - name: Upload SARIF
      if: steps.sarif.outcome == 'success'
      uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
      with:
        sarif_file: ${{ steps.sarif.outputs.file }}

    - name: Lint (fail-on gate)
      id: lint
      shell: bash
      continue-on-error: true
      run: |
        set +e
        out="$RUNNER_TEMP/webmcp-lint.human"
        extra=()
        if [ -n "${INPUTS_IGNORE}" ]; then extra+=(--ignore "${INPUTS_IGNORE}"); fi
        if [ "${INPUTS_RECURSIVE}" = "true" ]; then extra+=(--recursive); fi
        webmcp-lint "${INPUTS_PATH}" "${extra[@]}" --fail-on "${INPUTS_FAIL_ON}" --no-color > "$out" 2>&1
        code=$?
        set -e
        {
          echo "## webmcp-lint"
          echo ""
          echo '```'
          cat "$out"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        exit "$code"
      env:
        INPUTS_PATH: ${{ inputs.path }}
        INPUTS_FAIL_ON: ${{ inputs.fail-on }}
        INPUTS_IGNORE: ${{ inputs.ignore }}
        INPUTS_RECURSIVE: ${{ inputs.recursive }}

    - name: Evaluate gate
      id: gate
      if: always()
      shell: bash
      run: |
        code="${{ steps.lint.outcome }}"
        if [ "$code" = "success" ]; then
          echo "result=pass" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "result=fail" >> "$GITHUB_OUTPUT"
        exit 1
